<svg width="680" height="340" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<!-- Before and after template. Columns center on x=170 and x=510. Boxes are 280 wide, 44 tall
     (one line) or 56 tall (two lines). Grow height and viewBox together. Delete what you do not need. -->
<title id="t">Change title: before and after</title>
<desc id="d">One sentence that states what changed and why it matters.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="340" fill="#FFFFFF"/>
<text x="340" y="30" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="500" fill="#0F172A">Change title</text>
<text x="170" y="64" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0F172A">Before</text>
<text x="510" y="64" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0F172A">After</text>
<line x1="340" y1="50" x2="340" y2="290" stroke="#CBD5E1" stroke-width="0.5" stroke-dasharray="3 3"/>

<!-- Before: a step, then the problem -->
<rect x="30" y="88" width="280" height="44" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="1"/>
<text x="170" y="110" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#334155">A step that stays the same</text>
<line x1="170" y1="132" x2="170" y2="164" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="30" y="168" width="280" height="56" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1"/>
<text x="170" y="186" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#7F1D1D">The problem</text>
<text x="170" y="206" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#B91C1C">one short line of detail</text>

<!-- After: the new path, then the outcome -->
<rect x="370" y="88" width="280" height="56" rx="8" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1"/>
<text x="510" y="106" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#1E3A8A">The new path</text>
<text x="510" y="126" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1D4ED8">one short line of detail</text>
<line x1="510" y1="144" x2="510" y2="176" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="370" y="180" width="280" height="44" rx="8" fill="#F0FDF4" stroke="#15803D" stroke-width="1"/>
<text x="510" y="202" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#14532D">The outcome</text>

<!-- Legend: one entry per color you use -->
<rect x="40" y="306" width="12" height="12" rx="3" fill="#F1F5F9" stroke="#475569" stroke-width="1"/>
<text x="60" y="312" dominant-baseline="central" font-size="12" fill="#475569">unchanged</text>
<rect x="170" y="306" width="12" height="12" rx="3" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1"/>
<text x="190" y="312" dominant-baseline="central" font-size="12" fill="#475569">problem</text>
<rect x="290" y="306" width="12" height="12" rx="3" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1"/>
<text x="310" y="312" dominant-baseline="central" font-size="12" fill="#475569">new path</text>
<rect x="420" y="306" width="12" height="12" rx="3" fill="#F0FDF4" stroke="#15803D" stroke-width="1"/>
<text x="440" y="312" dominant-baseline="central" font-size="12" fill="#475569">outcome</text>
</svg>
