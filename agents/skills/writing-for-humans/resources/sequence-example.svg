<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The proof loop for a doc that people read</title>
<desc id="d">The author writes the doc. A fresh reviewer runs the script checks and the read checks. If a check fails, the reviewer sends the stock reply and the doc goes back to the author. If all checks pass, the doc goes to the reader.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="400" fill="#FFFFFF"/>
<text x="340" y="30" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="500" fill="#0F172A">The reviewer runs the checks, not the author</text>

<!-- Main column -->
<rect x="200" y="64" width="280" height="44" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="1"/>
<text x="340" y="86" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#334155">1. Author writes the doc</text>
<line x1="340" y1="108" x2="340" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="200" y="144" width="280" height="56" rx="8" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1"/>
<text x="340" y="162" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#1E3A8A">2. Fresh reviewer runs the checks</text>
<text x="340" y="182" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1D4ED8">4 script checks, 4 read checks</text>
<line x1="340" y1="200" x2="340" y2="232" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="352" y="216" dominant-baseline="central" font-size="12" fill="#475569">pass</text>
<rect x="200" y="236" width="280" height="44" rx="8" fill="#F0FDF4" stroke="#15803D" stroke-width="1"/>
<text x="340" y="258" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#14532D">3. The reader gets the doc</text>

<!-- Fail branch, left, back to the author -->
<rect x="20" y="316" width="300" height="56" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1"/>
<text x="170" y="334" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#7F1D1D">Fail: the stock reply</text>
<text x="170" y="354" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#B91C1C">"This does not meet our docs standard."</text>
<path d="M200 186 L120 186 L120 312" fill="none" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="128" y="250" dominant-baseline="central" font-size="12" fill="#B91C1C">fail</text>
<path d="M70 316 L70 86 L196 86" fill="none" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="78" y="200" dominant-baseline="central" font-size="12" fill="#B91C1C">revise</text>
</svg>
